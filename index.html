<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gabriel faz 1 aninho!</title>

<style>
/* --- SEU CSS ORIGINAL (mantido) --- */
/* (mantive tudo igual, só adicionei o feedback abaixo) */

body {
  margin: 0;
  background: #ece9e2;
  font-family: Georgia, serif;
}

/* ===== NOVO: FEEDBACK ===== */
.page-feedback {
  width: 100%;
  max-width: 360px;
  margin: 14px auto;
  text-align: center;
  font-size: 0.95rem;
  font-style: italic;
  color: #6a6958;
}

.page-feedback.success {
  color: #4e7a5c;
}

.page-feedback.error {
  color: #9b5a5a;
}

/* Modal básico (mantive o estilo leve) */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.is-open {
  display: flex;
}

.modal-card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  width: 90%;
  max-width: 400px;
}

.guest-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.guest-input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.submit-rsvp {
  background: #7a8e7f;
  color: white;
}

.add-guest {
  background: #eee;
}

.modal-feedback {
  margin-top: 10px;
  text-align: center;
}
</style>
</head>

<body>

<div style="text-align:center; padding:40px;">
  <h1>Gabriel faz 1 aninho!</h1>
  <button id="openRsvpModal">Confirmar presença</button>
</div>

<div id="pageFeedback" class="page-feedback"></div>

<!-- MODAL -->
<div class="modal-overlay" id="rsvpModal">
  <div class="modal-card">
    <h2>Confirmar presença</h2>

    <form id="rsvpForm">
      <div class="guest-list" id="guestList"></div>

      <button type="button" class="add-guest" id="addGuestButton">
        + Adicionar convidado
      </button>

      <button type="submit" class="submit-rsvp" id="submitRsvpButton">
        Confirmar presença
      </button>

      <div class="modal-feedback" id="modalFeedback"></div>
    </form>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJVeoK_7hGJob0Wxr8VZQoEJ1V8U5FibcIDb0Gv0g32BJaUtTN_cQdcDVG8fvg0PMNPg/exec";

const openBtn = document.getElementById("openRsvpModal");
const modal = document.getElementById("rsvpModal");
const guestList = document.getElementById("guestList");
const form = document.getElementById("rsvpForm");
const addBtn = document.getElementById("addGuestButton");
const submitBtn = document.getElementById("submitRsvpButton");
const modalFeedback = document.getElementById("modalFeedback");
const pageFeedback = document.getElementById("pageFeedback");

function renderField(value = "") {
  const input = document.createElement("input");
  input.className = "guest-input";
  input.placeholder = "Nome do convidado";
  input.value = value;
  guestList.appendChild(input);
}

function resetFields() {
  guestList.innerHTML = "";
  renderField();
}

openBtn.onclick = () => {
  modal.classList.add("is-open");
  resetFields();
};

modal.onclick = (e) => {
  if (e.target === modal) modal.classList.remove("is-open");
};

addBtn.onclick = () => {
  renderField();
};

function showPageMessage(msg, type) {
  pageFeedback.textContent = msg;
  pageFeedback.className = "page-feedback " + type;
}

form.onsubmit = async (e) => {
  e.preventDefault();

  const guestNames = [...guestList.querySelectorAll("input")]
    .map(i => i.value.trim())
    .filter(Boolean);

  if (!guestNames.length) {
    modalFeedback.textContent = "Digite pelo menos um nome.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Enviando...";
  modalFeedback.textContent = "";

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({ guestNames })
    });

    const data = await res.json();

    if (!data.success) throw new Error();

    modalFeedback.textContent = "Sua presença foi confirmada";
    showPageMessage("Sua presença foi confirmada", "success");

    setTimeout(() => {
      modal.classList.remove("is-open");
    }, 800);

  } catch {
    modalFeedback.textContent = "Erro ao enviar.";
    showPageMessage("Erro ao enviar. Tente novamente.", "error");
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Confirmar presença";
};
</script>

</body>
</html>
