<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Presença</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #2b2b2b;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.5;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: #8b6f47;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-secondary {
      background: #ece7df;
      color: #4d3e2b;
      width: 100%;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: #e3ddd3;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .modal p {
      margin-bottom: 20px;
    }

    .guest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .guest-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .guest-input {
      flex: 1;
      padding: 14px 12px;
      border: 1px solid #d7d2cb;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .guest-input:focus {
      border-color: #8b6f47;
    }

    .remove-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #f2efea;
      color: #7a5e38;
      font-size: 20px;
      line-height: 1;
    }

    .remove-btn:hover {
      background: #e7e1d8;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      display: none;
    }

    .message.success {
      display: block;
      background: #edf8ef;
      color: #23623a;
      border: 1px solid #cfe9d6;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #8a2323;
      border: 1px solid #f0cccc;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Confirmação de Presença</h1>
      <p>Toque no botão abaixo para informar o nome dos convidados.</p>

      <button class="btn btn-primary" id="openModalBtn">
        Confirmar presença
      </button>

      <div id="globalMessage" class="message"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Quem vai participar?</h2>
      <p>Preencha os nomes dos convidados.</p>

      <div class="guest-list" id="guestList"></div>

      <button class="btn btn-secondary" id="addGuestBtn" type="button">
        + Adicionar convidado
      </button>

      <div class="actions">
        <button class="btn btn-primary" id="submitBtn" type="button">
          Enviar confirmação
        </button>
        <button class="btn btn-secondary" id="closeModalBtn" type="button">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJVeoK_7hGJob0Wxr8VZQoEJ1V8U5FibcIDb0Gv0g32BJaUtTN_cQdcDVG8fvg0PMNPg/exec";

    const modalBackdrop = document.getElementById("modalBackdrop");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const addGuestBtn = document.getElementById("addGuestBtn");
    const submitBtn = document.getElementById("submitBtn");
    const guestList = document.getElementById("guestList");
    const globalMessage = document.getElementById("globalMessage");

    function createGuestRow(value = "") {
      const row = document.createElement("div");
      row.className = "guest-row";

      const input = document.createElement("input");
      input.type = "text";
      input.className = "guest-input";
      input.placeholder = "Nome do convidado";
      input.value = value;

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-btn";
      removeBtn.innerHTML = "×";
      removeBtn.setAttribute("aria-label", "Remover convidado");

      removeBtn.addEventListener("click", () => {
        if (guestList.children.length > 1) {
          row.remove();
        } else {
          input.value = "";
          input.focus();
        }
      });

      row.appendChild(input);
      row.appendChild(removeBtn);

      return row;
    }

    function resetGuestList() {
      guestList.innerHTML = "";
      guestList.appendChild(createGuestRow());
    }

    function openModal() {
      resetGuestList();
      modalBackdrop.classList.add("active");
      const firstInput = guestList.querySelector("input");
      if (firstInput) firstInput.focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove("active");
    }

    function showMessage(text, type) {
      globalMessage.textContent = text;
      globalMessage.className = `message ${type}`;
    }

    function clearMessage() {
      globalMessage.textContent = "";
      globalMessage.className = "message";
    }

    function getGuestNames() {
      const inputs = [...guestList.querySelectorAll(".guest-input")];
      return inputs
        .map(input => input.value.trim())
        .filter(name => name.length > 0);
    }

    async function submitConfirmation() {
      const guestNames = getGuestNames();

      if (guestNames.length === 0) {
        showMessage("Preencha pelo menos um nome.", "error");
        return;
      }

      clearMessage();
      submitBtn.classList.add("loading");
      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            guestNames
          })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.message || "Não foi possível confirmar.");
        }

        closeModal();
        showMessage("Sua presença foi confirmada.", "success");
      } catch (error) {
        showMessage("Erro ao enviar confirmação. Tente novamente.", "error");
        console.error(error);
      } finally {
        submitBtn.classList.remove("loading");
        submitBtn.disabled = false;
        submitBtn.textContent = "Enviar confirmação";
      }
    }

    openModalBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);

    addGuestBtn.addEventListener("click", () => {
      const row = createGuestRow();
      guestList.appendChild(row);
      const input = row.querySelector("input");
      if (input) input.focus();
    });

    submitBtn.addEventListener("click", submitConfirmation);

    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalBackdrop.classList.contains("active")) {
        closeModal();
      }
    });
  </script>
</body>
</html>
